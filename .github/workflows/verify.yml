name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            Backend/package-lock.json
            Next-Frontend/package-lock.json
      - run: npm ci --no-audit
        working-directory: Backend
      - run: npm test
        working-directory: Backend
      - run: npm ci --no-audit
        working-directory: Next-Frontend
      - run: npm test
        working-directory: Next-Frontend
      - run: npm run build
        working-directory: Next-Frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8080
          NEXT_PUBLIC_SITE_URL: https://theweddingvachan.com
